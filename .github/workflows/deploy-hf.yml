name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
    paths: [backend/**, deploy/huggingface/**, .github/workflows/deploy-hf.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needs repo secret HF_TOKEN and repo variable HF_SPACE (e.g. "jacek/perfectmove")
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Space contents
        run: |
          mkdir space
          cp -r backend/app backend/requirements.txt space/
          cp deploy/huggingface/Dockerfile deploy/huggingface/README.md space/
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
